    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px) saturate(150%);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(39, 174, 96, 0.3);
        }
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .slider-img { transition: opacity 1s ease-in-out; }
        .slider-img.hidden { opacity: 0; }
        .slider-img.active { opacity: 1; }
        .testimonial-slide {
            transition: opacity 0.5s ease-in-out;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .industrial-pulse {
            animation: pulse-subtle 4s ease-in-out infinite;
        }
        .particle {
            position: absolute;
            background-color: rgba(39, 174, 96, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes scaleUpLogo { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulseGlowLogo { from { transform: scale(0.9); opacity: 0.5; } to { transform: scale(1.1); opacity: 1; } }
        @keyframes slideUpSplash { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script>
        (function() {
            var h = window.location.hostname || '';
            var beklenen;
            if (h === 'localhost' || h === '127.0.0.1') {
                beklenen = 'orpay';
            } else {
                var temiz = h.replace(/^www\./i, '');
                beklenen = temiz.split('.')[0];
            }
            var mevcut = localStorage.getItem('aktif_firma');
            if (!mevcut || mevcut !== beklenen || mevcut === 'localhost' || mevcut === '127.0.0.1') {
                localStorage.setItem('aktif_firma', beklenen);
            }
        })();
    </script>

<body>
    <div id="app">
        <div class="ilk-yukleme" style="position:fixed; inset:0; background:var(--tema-arkaplan, #f4fbf1); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:99999;">
            <div class="orpay-splash-logo-container" style="position:relative; width:180px; height:180px; display:flex; align-items:center; justify-content:center; animation: scaleUpLogo 0.8s ease-out forwards;">
                <div class="glow-ring" style="position:absolute; inset:-30px; border-radius:50%; background:radial-gradient(circle, rgba(39, 174, 96, 0.25) 0%, transparent 70%); animation: pulseGlowLogo 2s infinite alternate;"></div>
                <img src="/logo.png" alt="Orpay Logo Yükleniyor" style="width:100%; height:auto; z-index:2; position:relative; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));" />
            </div>
            <div class="orpay-splash-text" style="margin-top:24px; font-family:'EB Garamond', serif; font-size:1.8rem; font-weight: 600; color:var(--tema-metin, #121414); letter-spacing:0.05em; opacity:0; animation: slideUpSplash 0.6s ease-out forwards; animation-delay: 0.3s;">
                ORPAY ORMAN ÜRÜNLERİ
            </div>
            <div class="orpay-splash-slogan" style="margin-top:12px; font-family:'Hanken Grotesk', sans-serif; font-size:0.85rem; color:var(--tema-metin-soluk, #727970); letter-spacing:0.18em; text-transform:uppercase; font-weight: 700; opacity:0; animation: slideUpSplash 0.6s ease-out forwards; animation-delay: 0.6s;">
                Mekanlara Değer Katan Tasarımlar
            </div>
        </div>
    </div>
