<!DOCTYPE html>
<html lang="tr" data-tema-id="gold" data-site-tema="gold" data-tema-mod="koyu">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ORPAY</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.css" rel="stylesheet" />
    <link href="css/sistem/tokens.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/sistem/orpay-public-shell.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
        .ilk-yukleme{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0a0a}
        .ilk-yukleme-logo{width:64px;height:64px;border-radius:18px;background:rgba(212,175,55,0.15);display:flex;align-items:center;justify-content:center;animation:nefes 2.2s ease-in-out infinite}
        .ilk-yukleme-logo span{font-size:28px;color:#d4af37;font-family:Georgia,serif}
        .ilk-yukleme-metin{margin:0;font-family:Roboto,sans-serif;font-size:0.78rem;letter-spacing:0.22em;text-transform:uppercase;color:#d4af37;opacity:0.85;animation:metinNefes 2.2s ease-in-out infinite}
        .ilk-yukleme-sarmal{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
        .ilk-yukleme-sarmal::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(212,175,55,0.18);border-top-color:#d4af37;animation:don 1.1s linear infinite}
        @keyframes don{to{transform:rotate(360deg)}}
        @keyframes nefes{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.92);opacity:0.85}}
        @keyframes metinNefes{0%,100%{opacity:0.85}50%{opacity:0.4}}
    </style>
</head>
<body>
    <div id="app">
        <div class="ilk-yukleme">
            <div class="ilk-yukleme-sarmal"><div class="ilk-yukleme-logo"><span>O</span></div></div>
            <p class="ilk-yukleme-metin">ORPAY</p>
        </div>
    </div>
    <div id="blazor-error-ui">Beklenmeyen bir hata oluştu. <a href="" class="reload">Yeniden yukle</a><a class="dismiss">x</a></div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.js"></script>
    <script src="js/tema.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded",function(){if(window.vizitlink3dTema&&window.vizitlink3dTema.siteBaslat)window.vizitlink3dTema.siteBaslat("gold")});
        window.vizitlink3dApiBaseUrl=(function(){var h=window.location.hostname||"";if(h==="localhost"||h==="127.0.0.1")return"http://localhost:5215";return window.location.origin})();
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        if(typeof window!=="undefined"&&typeof window.WebAssembly!=="undefined"&&typeof window.fetch!=="undefined")Blazor.start();
    </script>
</body>
</html>
