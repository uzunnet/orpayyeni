name: Docker Imajlari Ghcr'ye Yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GITHUB_USER: uzunnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repo'yu cek
        uses: actions/checkout@v4

      - name: QEMU kur
        uses: docker/setup-qemu-action@v3

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Ghcr'ye giris yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API imajini build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: VizitLink3D.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_USER }}/orpay-vizitlink3d-api:latest
            ghcr.io/${{ env.GITHUB_USER }}/orpay-vizitlink3d-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: UI imajini build ve push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: VizitLink3D.UI/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GITHUB_USER }}/orpay-vizitlink3d-ui:latest
            ghcr.io/${{ env.GITHUB_USER }}/orpay-vizitlink3d-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
